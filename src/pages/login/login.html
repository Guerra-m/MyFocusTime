<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>MyFocusTime</title>
  <link rel="stylesheet" href="login.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7574523768529448"
    crossorigin="anonymous"></script>
</head>

<body>

 <main>
  <h1>MyFocusTime</h1>
  <section class="login-container">
    <h2>Iniciar Sesión</h2>

    <form id="loginForm">
      <div class="input-group">
        <label for="mail">Correo</label>
        <input type="email" id="mail" name="mail" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button class="btn-login" type="submit">Entrar</button>

      <p id="errorMsg" style="color:red; display:none;">
        Usuario o contraseña incorrectos
      </p>

      <p class="register-text">
        ¿No tenés cuenta? <a href="../register/register.html">Registrate</a>
      </p>
    </form>
  </section>
</main>





  <footer>
    - Guerra - Todos los derechos reservados -
  </footer>
  <script src="./login.ts" type="module"></script>

</body>

</html>
