<!DOCTYPE html>
<html lang="en">

<head>
  <title>MyFocusTrack</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../pomodoro/pomodoro.css">
  <link rel="stylesheet" href="./settings.css">
  <link rel="icon" href="../../assets/MyFocusTrackLogo.png">
</head>

<body>
  <button id="menuToggle" class="hamburger">☰</button>
  <aside id="sidebar">
    <nav>
      <ul>
        <li><a href="../pomodoro/pomodoro.html">Focus</a></li>
        <li><a href="../stats/semana.html">Mis horas esta semana</a></li>
        <li><a href="../stats/mes.html">Mis horas este mes</a></li>
        <li><a href="../stats/anio.html">Mis horas este año</a></li>
        <li class="actual">Configuración</li>
        <li id="logoutBtn">Cerrar sesión</li>
      </ul>
    </nav>
  </aside>
  <main>
    <div class="settings-container">
      <h1>Configuración</h1>

      <div class="setting">
        <label>Tiempo de concentración (min)</label>
        <div class="setting-row">
          <input id="focusTime" type="number" min="1">
          <button id="saveFocus" class="settings-btn">Guardar</button>
        </div>
      </div>

      <div class="setting">
        <label>Tiempo de descanso (min)</label>
        <div class="setting-row">
          <input id="breakTime" type="number" min="1">
          <button id="saveBreak" class="settings-btn">Guardar</button>
        </div>
      </div>

      <p id="settingsMsg"></p>
    </div>
  </main>
  <footer class="app-footer">
    <div class="footer-content">
      <span>© 2025 MyFocusTime</span>
      <span class="footer-sep">•</span>
      <span>Desarrollado por Guerra</span>
      <span class="footer-sep">•</span>
      <span>Productividad & Seguimiento real</span>
    </div>
  </footer>
  <script type="module" src="./settings.ts"></script>

</body>

</html>
