<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>MyFocusTrack</title>
  <link rel="stylesheet" href="../pomodoro/pomodoro.css">
  <link rel="stylesheet" href="../stats/semana.css">
  <link rel="icon" href="../../assets/MyFocusTrackLogo.png">
</head>

<body>
  <!-- Botón hamburger -->
  <button id="menuToggle" class="hamburger">☰</button>
  <aside id="sidebar">

      <ul>
        <li><a href="../pomodoro/pomodoro.html">Focus</a></li>

        <li><a href="./anio.html">Mis horas este año</a></li>

      <div id="calendarWeek" class="calendar-week"></div>
      <p id="horasSemana" class="horasSemana"></p>
    </div>
  </main>
  <footer class="app-footer">
    <div class="footer-content">
