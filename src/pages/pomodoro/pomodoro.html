<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pomodoro</title>
  <link rel="stylesheet" href="./pomodoro.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7574523768529448"
     crossorigin="anonymous"></script>
</head>
<body>

  <!-- Botón hamburger -->
  <button id="menuToggle" class="hamburger">☰</button>

  <aside id="sidebar" class="collapsed">
    <nav>
      <ul>
        <li class="actual">Focus</li>
        <li><a href="../stats/semana.html">Mis horas esta semana</a></li>
        <li><a href="../stats/mes.html">Mis horas este mes</a></li>
        <li><a href="../stats/anio.html">Mis horas este año</a></li>
        <li><a href="../settings/settings.html">Configuración</a></li>
        <li id="logoutBtn">Cerrar sesión</li>
      </ul>
    </nav>
  </aside>

  <main>
    <h1>MyFocusTime</h1>

    <div class="timer-container">
      <div id="timer">50:00</div>
      <div id="status">Concentración</div>

      <div class="timer-controls">
        <button id="pauseBtn">Pausa</button>
        <button id="resetBtn">Resetear contador</button>
      </div>
      <div id="laps">Llevas 0 vueltas</div>

      <div class="controls">
        <button id="resetAllBtn">Resetear todo</button>
        
        <button id="skipBtn">Saltar</button>
      </div>
      <!--  -->
      <section class="tiempoEstudio">
        <p id="horasHoy">Hoy llevas estudiando 0 horas.</p>
        <button id="guardarBtn">Guardar</button>
      </section>
      <!-- Spo -->
      <div class="spotify-container">
        <iframe
          style="border-radius:12px"
          src="https://open.spotify.com/embed/playlist/37i9dQZF1DXbtuVQL4zoey"
          width="100%"
          height="152"
          frameborder="0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </div>

    </div>
  </main>

  <footer>
    - Guerra - Todos los derechos reservados -
  </footer>

  <script type="module" src="./pomodoro.ts"></script>




</body>
</html>
